<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clock</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17151B">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17151B;
    --surface: #201D26;
    --surface-2: #2A2632;
    --surface-3: #35303F;
    --accent: #D98E3A;
    --accent-dim: #4A3A28;
    --text: #F3EFE6;
    --text-dim: #9C97A6;
    --text-faint: #67626F;
    --danger: #E2574C;
    --danger-dim: #4A2724;
    --success: #6FBE8F;
    --border: #322D3A;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--font-body); overscroll-behavior:none; height:100%;}
  body{display:flex; flex-direction:column; height:100vh; height:100dvh;}
  button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
  input{font-family:inherit;}

  #app{flex:1; display:flex; flex-direction:column; overflow:hidden;}

  header{padding:20px 20px 12px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0;}
  header h1{font-family:var(--font-display); font-size:26px; font-weight:600; margin:0; letter-spacing:0.3px;}
  .header-btn{width:36px; height:36px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--accent);}
  .header-btn:active{background:var(--surface-3);}

  main{flex:1; overflow-y:auto; padding:0 16px 16px;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---------- World Clock ---------- */
  .city-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 18px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;}
  .city-info{display:flex; flex-direction:column; gap:4px;}
  .city-name{font-size:15px; font-weight:500;}
  .city-meta{font-size:12px; color:var(--text-dim);}
  .city-right{display:flex; align-items:center; gap:12px;}
  .city-time{font-family:var(--font-display); font-size:26px; font-weight:500; letter-spacing:0.5px;}
  .city-remove{width:26px; height:26px; border-radius:50%; color:var(--text-faint); display:flex; align-items:center; justify-content:center; font-size:14px;}
  .city-remove:active{background:var(--surface-3); color:var(--text);}
  .empty-state{text-align:center; padding:60px 20px; color:var(--text-dim);}
  .empty-state p{font-size:14px; margin:8px 0 0;}

  .add-city-btn{width:100%; padding:14px; border-radius:16px; border:1px dashed var(--border); color:var(--accent); font-size:14px; font-weight:500; margin-top:6px; display:flex; align-items:center; justify-content:center; gap:8px;}
  .add-city-btn:active{background:var(--surface);}

  /* City picker sheet */
  .sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; align-items:flex-end; z-index:50;}
  .sheet-backdrop.active{display:flex;}
  .sheet{background:var(--surface); width:100%; max-height:70vh; border-radius:20px 20px 0 0; padding:16px 16px 24px; overflow-y:auto;}
  .sheet-handle{width:36px; height:4px; background:var(--surface-3); border-radius:2px; margin:0 auto 14px;}
  .sheet-title{font-size:16px; font-weight:600; margin:0 0 12px; padding:0 4px;}
  .sheet-item{padding:14px 8px; font-size:15px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; color:var(--text);}
  .sheet-item:active{background:var(--surface-2);}
  .sheet-item span{color:var(--text-dim); font-size:13px;}

  /* ---------- Alarm ---------- */
  .alarm-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 18px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;}
  .alarm-card.disabled .alarm-time, .alarm-card.disabled .alarm-label{opacity:0.4;}
  .alarm-time{font-family:var(--font-display); font-size:30px; font-weight:500;}
  .alarm-label{font-size:12px; color:var(--text-dim); margin-top:4px;}
  .switch{width:46px; height:28px; border-radius:14px; background:var(--surface-3); position:relative; flex-shrink:0;}
  .switch.on{background:var(--accent);}
  .switch::after{content:''; position:absolute; width:22px; height:22px; border-radius:50%; background:var(--text); top:3px; left:3px; transition:transform 0.15s;}
  .switch.on::after{transform:translateX(18px); background:#20180C;}

  .add-alarm-btn{width:100%; padding:14px; border-radius:16px; border:1px dashed var(--border); color:var(--accent); font-size:14px; font-weight:500; margin-top:6px; display:flex; align-items:center; justify-content:center; gap:8px;}
  .add-alarm-btn:active{background:var(--surface);}

  .alarm-editor{background:var(--surface); border-radius:20px; padding:20px; margin-bottom:14px;}
  .alarm-editor input[type="time"]{width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:14px; color:var(--text); font-family:var(--font-display); font-size:28px; text-align:center; margin-bottom:14px;}
  .alarm-editor input[type="text"]{width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; color:var(--text); font-size:14px; margin-bottom:14px;}
  .editor-actions{display:flex; gap:10px;}
  .btn{flex:1; padding:13px; border-radius:12px; font-size:14px; font-weight:500; text-align:center;}
  .btn-primary{background:var(--accent); color:#20180C;}
  .btn-secondary{background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);}
  .btn:active{opacity:0.85;}

  .ringing-banner{background:var(--danger-dim); border:1px solid var(--danger); border-radius:16px; padding:18px; margin-bottom:14px; text-align:center;}
  .ringing-banner .rt{font-family:var(--font-display); font-size:15px; color:var(--danger); font-weight:500; margin-bottom:2px;}
  .ringing-banner .rl{font-size:13px; color:var(--text-dim); margin-bottom:14px;}
  .ringing-actions{display:flex; gap:10px;}

  /* ---------- Stopwatch ---------- */
  .sw-wrap{display:flex; flex-direction:column; align-items:center; padding-top:30px;}
  .sw-display{font-family:var(--font-display); font-size:56px; font-weight:600; letter-spacing:1px; margin-bottom:6px;}
  .sw-display .ms{font-size:28px; color:var(--text-dim);}
  .sw-controls{display:flex; gap:16px; margin:26px 0 20px;}
  .round-btn{width:72px; height:72px; border-radius:50%; font-size:14px; font-weight:500; display:flex; align-items:center; justify-content:center; border:1px solid var(--border);}
  .round-btn.start{background:var(--success); color:#0F2A1B; border:none;}
  .round-btn.stop{background:var(--danger); color:#3A0E0A; border:none;}
  .round-btn.lap{background:var(--surface-2); color:var(--text);}
  .round-btn:active{opacity:0.85;}
  .laps{width:100%; margin-top:10px;}
  .lap-row{display:flex; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--border); font-family:var(--font-display); font-size:15px;}
  .lap-row span:first-child{color:var(--text-dim); font-family:var(--font-body); font-size:13px;}
  .lap-row.best{color:var(--success);}
  .lap-row.worst{color:var(--danger);}

  /* ---------- Timer ---------- */
  .timer-wrap{display:flex; flex-direction:column; align-items:center; padding-top:20px;}
  .timer-ring-wrap{position:relative; width:260px; height:260px; margin:10px 0 24px;}
  .timer-ring-wrap svg{transform:rotate(-90deg);}
  .timer-center{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;}
  .timer-display{font-family:var(--font-display); font-size:42px; font-weight:600;}
  .timer-sub{font-size:12px; color:var(--text-dim); margin-top:4px;}

  .timer-set{display:flex; gap:10px; width:100%; margin-bottom:16px;}
  .timer-field{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 0; text-align:center;}
  .timer-field label{display:block; font-size:11px; color:var(--text-dim); margin-bottom:6px;}
  .timer-field input{width:100%; background:none; border:none; color:var(--text); font-family:var(--font-display); font-size:24px; text-align:center; outline:none;}

  .presets{display:flex; gap:8px; width:100%; margin-bottom:20px; flex-wrap:wrap;}
  .preset-chip{padding:8px 14px; border-radius:20px; background:var(--surface-2); border:1px solid var(--border); font-size:13px; color:var(--text-dim);}
  .preset-chip:active{background:var(--surface-3);}

  .timer-controls{display:flex; gap:16px;}

  /* ---------- Tab bar ---------- */
  nav{flex-shrink:0; display:flex; border-top:1px solid var(--border); background:var(--surface); padding-bottom:env(safe-area-inset-bottom, 6px);}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 0 8px; color:var(--text-faint);}
  .tab.active{color:var(--accent);}
  .tab svg{width:22px; height:22px;}
  .tab-label{font-size:11px; font-weight:500;}

  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
</style>
</head>
<body>

<div id="app">
  <header>
    <h1 id="header-title">World clock</h1>
    <button class="header-btn" id="header-action" aria-label="Add"></button>
  </header>

  <main>
    <!-- World Clock -->
    <section class="view active" id="view-world">
      <div id="city-list"></div>
      <button class="add-city-btn" id="btn-add-city">+ Add city</button>
    </section>

    <!-- Alarm -->
    <section class="view" id="view-alarm">
      <div id="ringing-banner-slot"></div>
      <div id="alarm-editor-slot"></div>
      <div id="alarm-list"></div>
      <button class="add-alarm-btn" id="btn-add-alarm">+ Add alarm</button>
    </section>

    <!-- Stopwatch -->
    <section class="view" id="view-stopwatch">
      <div class="sw-wrap">
        <div class="sw-display"><span id="sw-time">00:00</span><span class="ms" id="sw-ms">.00</span></div>
        <div class="sw-controls">
          <button class="round-btn lap" id="sw-lap" disabled>Lap</button>
          <button class="round-btn start" id="sw-toggle">Start</button>
        </div>
        <div class="laps" id="sw-laps"></div>
      </div>
    </section>

    <!-- Timer -->
    <section class="view" id="view-timer">
      <div class="timer-wrap">
        <div id="timer-setup">
          <div class="timer-set">
            <div class="timer-field"><label>Hours</label><input type="number" id="t-h" min="0" max="23" value="0"></div>
            <div class="timer-field"><label>Minutes</label><input type="number" id="t-m" min="0" max="59" value="5"></div>
            <div class="timer-field"><label>Seconds</label><input type="number" id="t-s" min="0" max="59" value="0"></div>
          </div>
          <div class="presets">
            <button class="preset-chip" data-secs="60">1 min</button>
            <button class="preset-chip" data-secs="180">3 min</button>
            <button class="preset-chip" data-secs="300">5 min</button>
            <button class="preset-chip" data-secs="600">10 min</button>
            <button class="preset-chip" data-secs="1800">30 min</button>
          </div>
        </div>
        <div class="timer-ring-wrap">
          <svg width="260" height="260" viewBox="0 0 260 260">
            <circle cx="130" cy="130" r="115" fill="none" stroke="#2A2632" stroke-width="10"/>
            <circle id="timer-arc" cx="130" cy="130" r="115" fill="none" stroke="#D98E3A" stroke-width="10" stroke-linecap="round" stroke-dasharray="722.6" stroke-dashoffset="0"/>
          </svg>
          <div class="timer-center">
            <div class="timer-display" id="timer-display">05:00</div>
            <div class="timer-sub" id="timer-sub">ready</div>
          </div>
        </div>
        <div class="timer-controls">
          <button class="round-btn stop" id="timer-reset">Reset</button>
          <button class="round-btn start" id="timer-toggle">Start</button>
        </div>
      </div>
    </section>
  </main>

  <nav>
    <button class="tab active" data-view="world">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.7 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.7-3.8-9s1.3-6.5 3.8-9z"/></svg>
      <span class="tab-label">World</span>
    </button>
    <button class="tab" data-view="alarm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M5 3 2 6M22 6l-3-3"/></svg>
      <span class="tab-label">Alarm</span>
    </button>
    <button class="tab" data-view="stopwatch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M9.5 2.5h5M12 5v0M18.5 6.5 20 5"/></svg>
      <span class="tab-label">Stopwatch</span>
    </button>
    <button class="tab" data-view="timer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2h8M8 22h8M6 2c0 5 12 5 12 10s-12 5-12 10M18 2c0 5-12 5-12 10s12 5 12 10"/></svg>
      <span class="tab-label">Timer</span>
    </button>
  </nav>
</div>

<div class="sheet-backdrop" id="sheet-backdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <p class="sheet-title">Add a city</p>
    <div id="sheet-list"></div>
  </div>
</div>

<script>
/* ============ shared data ============ */
var CITY_CATALOG = [
  {name:'New York', tz:'America/New_York'},
  {name:'Los Angeles', tz:'America/Los_Angeles'},
  {name:'Sao Paulo', tz:'America/Sao_Paulo'},
  {name:'London', tz:'Europe/London'},
  {name:'Paris', tz:'Europe/Paris'},
  {name:'Cairo', tz:'Africa/Cairo'},
  {name:'Dubai', tz:'Asia/Dubai'},
  {name:'Dhaka', tz:'Asia/Dhaka'},
  {name:'Kolkata', tz:'Asia/Kolkata'},
  {name:'Bangkok', tz:'Asia/Bangkok'},
  {name:'Singapore', tz:'Asia/Singapore'},
  {name:'Hong Kong', tz:'Asia/Hong_Kong'},
  {name:'Tokyo', tz:'Asia/Tokyo'},
  {name:'Seoul', tz:'Asia/Seoul'},
  {name:'Sydney', tz:'Australia/Sydney'},
  {name:'Auckland', tz:'Pacific/Auckland'},
  {name:'Moscow', tz:'Europe/Moscow'},
  {name:'Toronto', tz:'America/Toronto'}
];

var state = {
  cities: [
    {name:'Dhaka', tz:'Asia/Dhaka'},
    {name:'London', tz:'Europe/London'},
    {name:'New York', tz:'America/New_York'},
    {name:'Tokyo', tz:'Asia/Tokyo'}
  ],
  alarms: [],
  editingAlarm: false,
  ringingAlarm: null
};

/* ============ tab switching ============ */
var titles = {world:'World clock', alarm:'Alarm', stopwatch:'Stopwatch', timer:'Timer'};
document.querySelectorAll('.tab').forEach(function(tab){
  tab.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
    document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
    tab.classList.add('active');
    var name = tab.dataset.view;
    document.getElementById('view-'+name).classList.add('active');
    document.getElementById('header-title').textContent = titles[name];
    var actionBtn = document.getElementById('header-action');
    actionBtn.style.visibility = 'hidden';
  });
});

/* ============ World clock ============ */
function offsetLabel(tz){
  try{
    var now = new Date();
    var f = new Intl.DateTimeFormat('en-US', {timeZone: tz, timeZoneName:'shortOffset'});
    var parts = f.formatToParts(now);
    var off = parts.find(function(p){return p.type==='timeZoneName';});
    return off ? off.value : '';
  }catch(e){ return ''; }
}
function dayDiffLabel(tz){
  var here = new Date();
  var localDay = here.getDate();
  var tzDay = new Date(here.toLocaleString('en-US', {timeZone: tz})).getDate();
  if(tzDay === localDay) return 'Today';
  var hereMonth = here.getMonth();
  var tzDate = new Date(here.toLocaleString('en-US', {timeZone: tz}));
  if(tzDate.getTime() > here.getTime() || (tzDay > localDay)) return 'Tomorrow';
  return 'Yesterday';
}
function renderCities(){
  var list = document.getElementById('city-list');
  if(state.cities.length === 0){
    list.innerHTML = '<div class="empty-state"><p>No cities added yet.</p></div>';
    return;
  }
  list.innerHTML = '';
  state.cities.forEach(function(c, idx){
    var timeStr = new Intl.DateTimeFormat('en-US', {timeZone:c.tz, hour:'2-digit', minute:'2-digit', hour12:true}).format(new Date());
    var card = document.createElement('div');
    card.className = 'city-card';
    card.innerHTML =
      '<div class="city-info">' +
        '<div class="city-name">'+c.name+'</div>' +
        '<div class="city-meta">'+dayDiffLabel(c.tz)+' &middot; '+offsetLabel(c.tz)+'</div>' +
      '</div>' +
      '<div class="city-right">' +
        '<div class="city-time">'+timeStr+'</div>' +
        '<button class="city-remove" aria-label="Remove '+c.name+'">&#10005;</button>' +
      '</div>';
    card.querySelector('.city-remove').addEventListener('click', function(){
      state.cities.splice(idx,1);
      renderCities();
    });
    list.appendChild(card);
  });
}
function openCitySheet(){
  var sheetList = document.getElementById('sheet-list');
  sheetList.innerHTML = '';
  var added = state.cities.map(function(c){return c.tz;});
  CITY_CATALOG.filter(function(c){return added.indexOf(c.tz) === -1;}).forEach(function(c){
    var item = document.createElement('div');
    item.className = 'sheet-item';
    item.innerHTML = '<div>'+c.name+'</div><span>'+offsetLabel(c.tz)+'</span>';
    item.addEventListener('click', function(){
      state.cities.push(c);
      renderCities();
      document.getElementById('sheet-backdrop').classList.remove('active');
    });
    sheetList.appendChild(item);
  });
  document.getElementById('sheet-backdrop').classList.add('active');
}
document.getElementById('btn-add-city').addEventListener('click', openCitySheet);
document.getElementById('sheet-backdrop').addEventListener('click', function(e){
  if(e.target === this) this.classList.remove('active');
});

/* ============ Alarm ============ */
function beep(duration, freq){
  try{
    var ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq || 880;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (duration||0.4));
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + (duration||0.4) + 0.05);
  }catch(e){}
}
var alarmLoop = null;
function startAlarmSound(){
  stopAlarmSound();
  beep(0.5, 950);
  alarmLoop = setInterval(function(){ beep(0.5, 950); if(navigator.vibrate) navigator.vibrate(400); }, 900);
}
function stopAlarmSound(){
  if(alarmLoop){ clearInterval(alarmLoop); alarmLoop = null; }
}

function renderAlarmEditor(){
  var slot = document.getElementById('alarm-editor-slot');
  if(!state.editingAlarm){ slot.innerHTML = ''; return; }
  slot.innerHTML =
    '<div class="alarm-editor">' +
      '<input type="time" id="new-alarm-time" value="07:00">' +
      '<input type="text" id="new-alarm-label" placeholder="Label (optional)">' +
      '<div class="editor-actions">' +
        '<button class="btn btn-secondary" id="cancel-alarm">Cancel</button>' +
        '<button class="btn btn-primary" id="save-alarm">Save alarm</button>' +
      '</div>' +
    '</div>';
  document.getElementById('cancel-alarm').addEventListener('click', function(){
    state.editingAlarm = false; renderAlarmEditor();
  });
  document.getElementById('save-alarm').addEventListener('click', function(){
    var t = document.getElementById('new-alarm-time').value || '07:00';
    var l = document.getElementById('new-alarm-label').value.trim();
    state.alarms.push({id: Date.now(), time:t, label:l, enabled:true, lastFiredMinute:null});
    state.editingAlarm = false;
    renderAlarmEditor();
    renderAlarms();
  });
}
function fmtAlarmTime(t){
  var parts = t.split(':');
  var h = parseInt(parts[0],10), m = parts[1];
  var ap = h >= 12 ? 'PM' : 'AM';
  var h12 = h % 12; if(h12 === 0) h12 = 12;
  return h12 + ':' + m + ' ' + ap;
}
function renderAlarms(){
  var list = document.getElementById('alarm-list');
  if(state.alarms.length === 0 && !state.editingAlarm){
    list.innerHTML = '<div class="empty-state"><p>No alarms set.</p></div>';
    return;
  }
  list.innerHTML = '';
  state.alarms.slice().sort(function(a,b){return a.time.localeCompare(b.time);}).forEach(function(a){
    var card = document.createElement('div');
    card.className = 'alarm-card' + (a.enabled ? '' : ' disabled');
    card.innerHTML =
      '<div>' +
        '<div class="alarm-time">'+fmtAlarmTime(a.time)+'</div>' +
        '<div class="alarm-label">'+(a.label || 'Alarm')+'</div>' +
      '</div>' +
      '<div style="display:flex; align-items:center; gap:14px;">' +
        '<button class="city-remove" aria-label="Delete alarm">&#10005;</button>' +
        '<div class="switch '+(a.enabled?'on':'')+'"></div>' +
      '</div>';
    card.querySelector('.switch').addEventListener('click', function(){
      a.enabled = !a.enabled;
      renderAlarms();
    });
    card.querySelector('.city-remove').addEventListener('click', function(){
      state.alarms = state.alarms.filter(function(x){return x.id !== a.id;});
      renderAlarms();
    });
    list.appendChild(card);
  });
}
document.getElementById('btn-add-alarm').addEventListener('click', function(){
  state.editingAlarm = true;
  renderAlarmEditor();
});
function renderRinging(){
  var slot = document.getElementById('ringing-banner-slot');
  if(!state.ringingAlarm){ slot.innerHTML=''; return; }
  var a = state.ringingAlarm;
  slot.innerHTML =
    '<div class="ringing-banner">' +
      '<div class="rt">'+fmtAlarmTime(a.time)+'</div>' +
      '<div class="rl">'+(a.label || 'Alarm')+' is ringing</div>' +
      '<div class="ringing-actions">' +
        '<button class="btn btn-secondary" id="snooze-alarm">Snooze 5 min</button>' +
        '<button class="btn btn-primary" id="dismiss-alarm">Dismiss</button>' +
      '</div>' +
    '</div>';
  document.getElementById('dismiss-alarm').addEventListener('click', function(){
    stopAlarmSound();
    state.ringingAlarm = null;
    renderRinging();
  });
  document.getElementById('snooze-alarm').addEventListener('click', function(){
    stopAlarmSound();
    var snoozeTime = new Date(Date.now() + 5*60000);
    var hh = String(snoozeTime.getHours()).padStart(2,'0');
    var mm = String(snoozeTime.getMinutes()).padStart(2,'0');
    state.alarms.push({id: Date.now(), time: hh+':'+mm, label:(a.label||'Alarm')+' (snoozed)', enabled:true, lastFiredMinute:null});
    state.ringingAlarm = null;
    renderRinging();
    renderAlarms();
  });
}
function checkAlarms(){
  if(state.ringingAlarm) return;
  var now = new Date();
  var hh = String(now.getHours()).padStart(2,'0');
  var mm = String(now.getMinutes()).padStart(2,'0');
  var cur = hh+':'+mm;
  var minuteKey = now.getFullYear()+'-'+now.getMonth()+'-'+now.getDate()+'-'+hh+'-'+mm;
  state.alarms.forEach(function(a){
    if(a.enabled && a.time === cur && a.lastFiredMinute !== minuteKey){
      a.lastFiredMinute = minuteKey;
      state.ringingAlarm = a;
      renderRinging();
      startAlarmSound();
    }
  });
}

/* ============ Stopwatch ============ */
var swState = {running:false, startTs:0, elapsed:0, laps:[]};
var swInterval = null;
function fmtStopwatch(ms){
  var totalCs = Math.floor(ms/10);
  var cs = totalCs % 100;
  var totalSec = Math.floor(totalCs/100);
  var s = totalSec % 60;
  var m = Math.floor(totalSec/60);
  return {
    main: String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'),
    cs: '.'+String(cs).padStart(2,'0')
  };
}
function renderStopwatch(){
  var elapsed = swState.elapsed + (swState.running ? (Date.now()-swState.startTs) : 0);
  var f = fmtStopwatch(elapsed);
  document.getElementById('sw-time').textContent = f.main;
  document.getElementById('sw-ms').textContent = f.cs;
}
function renderLaps(){
  var wrap = document.getElementById('sw-laps');
  if(swState.laps.length === 0){ wrap.innerHTML=''; return; }
  var times = swState.laps.map(function(l){return l.lapMs;});
  var min = Math.min.apply(null, times), max = Math.max.apply(null, times);
  wrap.innerHTML = '';
  swState.laps.slice().reverse().forEach(function(l){
    var row = document.createElement('div');
    var cls = 'lap-row';
    if(swState.laps.length > 1){
      if(l.lapMs === min) cls += ' best';
      else if(l.lapMs === max) cls += ' worst';
    }
    row.className = cls;
    var f = fmtStopwatch(l.lapMs);
    row.innerHTML = '<span>Lap '+l.n+'</span><span>'+f.main+f.cs+'</span>';
    wrap.appendChild(row);
  });
}
document.getElementById('sw-toggle').addEventListener('click', function(){
  var btn = this;
  if(!swState.running){
    swState.running = true;
    swState.startTs = Date.now();
    btn.textContent = 'Stop';
    btn.classList.remove('start'); btn.classList.add('stop');
    document.getElementById('sw-lap').disabled = false;
    swInterval = setInterval(renderStopwatch, 30);
  }else{
    swState.running = false;
    swState.elapsed += Date.now() - swState.startTs;
    btn.textContent = 'Start';
    btn.classList.remove('stop'); btn.classList.add('start');
    clearInterval(swInterval);
    renderStopwatch();
    document.getElementById('sw-lap').textContent = 'Reset';
  }
});
document.getElementById('sw-lap').addEventListener('click', function(){
  if(swState.running){
    var elapsed = swState.elapsed + (Date.now()-swState.startTs);
    var prevTotal = swState.laps.length ? swState.laps[swState.laps.length-1].total : 0;
    swState.laps.push({n: swState.laps.length+1, total: elapsed, lapMs: elapsed - prevTotal});
    renderLaps();
  }else{
    swState.elapsed = 0; swState.laps = [];
    document.getElementById('sw-lap').textContent = 'Lap';
    document.getElementById('sw-lap').disabled = true;
    renderStopwatch();
    renderLaps();
  }
});

/* ============ Timer ============ */
var TIMER_CIRC = 2 * Math.PI * 115;
document.getElementById('timer-arc').setAttribute('stroke-dasharray', TIMER_CIRC.toFixed(1));
var tState = {totalMs:0, remainingMs:0, running:false, startTs:0, interval:null};

function readTimerInputs(){
  var h = parseInt(document.getElementById('t-h').value||0,10);
  var m = parseInt(document.getElementById('t-m').value||0,10);
  var s = parseInt(document.getElementById('t-s').value||0,10);
  return (h*3600 + m*60 + s) * 1000;
}
function fmtTimer(ms){
  var totalSec = Math.max(0, Math.ceil(ms/1000));
  var h = Math.floor(totalSec/3600);
  var m = Math.floor((totalSec%3600)/60);
  var s = totalSec%60;
  if(h > 0) return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function updateTimerDisplay(){
  var remaining = tState.running ? Math.max(0, tState.remainingMs - (Date.now()-tState.startTs)) : tState.remainingMs;
  document.getElementById('timer-display').textContent = fmtTimer(remaining);
  var frac = tState.totalMs > 0 ? remaining / tState.totalMs : 0;
  var offset = TIMER_CIRC * (1 - frac);
  document.getElementById('timer-arc').style.strokeDashoffset = offset.toFixed(1);
  if(tState.running && remaining <= 0){
    finishTimer();
  }
}
function finishTimer(){
  tState.running = false;
  clearInterval(tState.interval);
  document.getElementById('timer-sub').textContent = 'time is up';
  document.getElementById('timer-toggle').textContent = 'Start';
  document.getElementById('timer-toggle').classList.remove('stop'); document.getElementById('timer-toggle').classList.add('start');
  document.getElementById('timer-display').textContent = fmtTimer(0);
  document.getElementById('timer-arc').style.strokeDashoffset = '0';
  beep(0.6, 700);
  setTimeout(function(){ beep(0.6,700); },700);
  setTimeout(function(){ beep(0.6,700); },1400);
  if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]);
}
document.getElementById('timer-toggle').addEventListener('click', function(){
  var btn = this;
  if(!tState.running){
    if(tState.remainingMs <= 0){
      tState.totalMs = readTimerInputs();
      tState.remainingMs = tState.totalMs;
    }
    if(tState.remainingMs <= 0) return;
    tState.running = true;
    tState.startTs = Date.now();
    document.getElementById('timer-setup').style.display = 'none';
    document.getElementById('timer-sub').textContent = 'running';
    btn.textContent = 'Pause';
    btn.classList.remove('start'); btn.classList.add('stop');
    tState.interval = setInterval(updateTimerDisplay, 200);
  }else{
    tState.running = false;
    tState.remainingMs = Math.max(0, tState.remainingMs - (Date.now()-tState.startTs));
    clearInterval(tState.interval);
    document.getElementById('timer-sub').textContent = 'paused';
    btn.textContent = 'Resume';
    btn.classList.remove('stop'); btn.classList.add('start');
  }
});
document.getElementById('timer-reset').addEventListener('click', function(){
  tState.running = false;
  clearInterval(tState.interval);
  tState.totalMs = 0; tState.remainingMs = 0;
  document.getElementById('timer-setup').style.display = 'block';
  document.getElementById('timer-sub').textContent = 'ready';
  document.getElementById('timer-toggle').textContent = 'Start';
  document.getElementById('timer-toggle').classList.remove('stop'); document.getElementById('timer-toggle').classList.add('start');
  document.getElementById('timer-arc').style.strokeDashoffset = '0';
  var h = parseInt(document.getElementById('t-h').value||0,10);
  var m = parseInt(document.getElementById('t-m').value||0,10);
  var s = parseInt(document.getElementById('t-s').value||0,10);
  document.getElementById('timer-display').textContent = fmtTimer((h*3600+m*60+s)*1000);
});
document.querySelectorAll('.preset-chip').forEach(function(chip){
  chip.addEventListener('click', function(){
    var secs = parseInt(chip.dataset.secs,10);
    document.getElementById('t-h').value = Math.floor(secs/3600);
    document.getElementById('t-m').value = Math.floor((secs%3600)/60);
    document.getElementById('t-s').value = secs%60;
    document.getElementById('timer-display').textContent = fmtTimer(secs*1000);
  });
});
['t-h','t-m','t-s'].forEach(function(id){
  document.getElementById(id).addEventListener('input', function(){
    if(tState.running || tState.remainingMs > 0) return;
    document.getElementById('timer-display').textContent = fmtTimer(readTimerInputs());
  });
});

/* ============ init & ticking ============ */
document.getElementById('header-action').style.visibility = 'hidden';
renderCities();
renderAlarms();
renderAlarmEditor();
renderRinging();
renderStopwatch();
document.getElementById('timer-display').textContent = fmtTimer(readTimerInputs());

setInterval(function(){
  renderCities();
  checkAlarms();
}, 1000);

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
